<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#060E12;font-family:'Inter',sans-serif;}
.root{position:relative;width:1080px;height:1920px;}
.glow-top{position:absolute;top:-150px;left:50%;transform:translateX(-50%);width:900px;height:900px;background:radial-gradient(ellipse,rgba(22,195,204,0.13),transparent 65%);pointer-events:none;}
.glow-bottom{position:absolute;bottom:-150px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(ellipse,rgba(22,195,204,0.07),transparent 65%);pointer-events:none;}
.bar-left{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#16C3CC,transparent);}
.bar-top{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#16C3CC,transparent);}
.header{position:absolute;top:56px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;color:#16C3CC;text-transform:uppercase;}
.tag{background:rgba(22,195,204,0.1);border:1px solid rgba(22,195,204,0.3);border-radius:20px;padding:7px 16px;font-size:11px;font-weight:800;letter-spacing:2px;color:#16C3CC;text-transform:uppercase;}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:160px 64px;text-align:center;}
.emoji{font-size:110px;margin-bottom:36px;line-height:1;}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:5px;color:#16C3CC;text-transform:uppercase;margin-bottom:24px;}
.h1{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:900;text-transform:uppercase;line-height:0.88;color:#FFF;margin-bottom:24px;}
.h1 span{color:#16C3CC;}
.sub{font-size:26px;font-weight:500;color:rgba(184,205,211,0.6);line-height:1.5;margin-bottom:64px;}
.sub strong{color:#FFF;}
.poll{width:100%;display:flex;flex-direction:column;gap:18px;margin-bottom:48px;}
.opt{border-radius:18px;padding:30px 36px;font-size:24px;font-weight:700;text-align:left;display:flex;align-items:center;gap:14px;}
.opt.a{background:rgba(22,195,204,0.1);border:2px solid rgba(22,195,204,0.35);color:#16C3CC;}
.opt.b{background:rgba(251,191,36,0.08);border:2px solid rgba(251,191,36,0.3);color:#FBBF24;}
.opt.c{background:rgba(74,222,128,0.08);border:2px solid rgba(74,222,128,0.3);color:#4ADE80;}
.opt.d{background:rgba(255,69,69,0.08);border:2px solid rgba(255,69,69,0.3);color:#FF4545;}
.footer{position:absolute;bottom:52px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;}
.handle{font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(184,205,211,0.25);text-transform:uppercase;}
</style>
</head>
<body>
<div class="root">
  <div class="glow-top"></div><div class="glow-bottom"></div>
  <div class="bar-left"></div><div class="bar-top"></div>
  <div class="header"><span class="brand">smartguest</span><span class="tag">Enquete</span></div>
  <div class="content">
    <div class="emoji">⏱️</div>
    <div class="eyebrow">Para você, gestor hoteleiro</div>
    <div class="h1">QUANTO TEMPO VOCÊ PERDE POR <span>DIA</span>?</div>
    <p class="sub">Verificando <strong>quartos, reservas e status</strong> manualmente...</p>
    <div class="poll">
      <div class="opt a">⚡ Menos de 30 minutos</div>
      <div class="opt b">🕐 De 30min a 1 hora</div>
      <div class="opt c">😓 De 1h a 2 horas</div>
      <div class="opt d">🚨 Mais de 2 horas por dia</div>
    </div>
  </div>
  <div class="footer"><span class="handle">@smartguest.app</span><span class="handle">smartguest.app</span></div>
</div>
</body>
</html>
