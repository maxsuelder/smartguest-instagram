<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGuest – Quanto Tempo Você Perde?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030a0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  #story {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    position: relative;
    background: #060E12;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  /* grain overlay */
  #story::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  /* teal glow top */
  #story::after {
    content: '';
    position: absolute;
    top: -160px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 700px;
    background: radial-gradient(ellipse, rgba(22,195,204,0.18) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── ZONA TOPO ~300px ── */
  .zone-top {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    gap: 20px;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: #16C3CC;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .tag {
    display: inline-block;
    background: rgba(22,195,204,0.12);
    border: 1px solid rgba(22,195,204,0.4);
    color: #16C3CC;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 100px;
  }

  /* ── ZONA MEIO ~1100px ── */
  .zone-mid {
    position: relative;
    z-index: 1;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    gap: 60px;
  }

  .question {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 100px;
    line-height: 0.95;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    text-align: center;
  }

  .question span {
    color: #16C3CC;
  }

  .options {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }

  .option {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(22,195,204,0.3);
    border-radius: 24px;
    padding: 44px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }

  .option::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #16C3CC, rgba(22,195,204,0.3));
    border-radius: 4px 0 0 4px;
  }

  .option-dot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2.5px solid rgba(22,195,204,0.5);
    flex-shrink: 0;
  }

  .option-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 44px;
    color: #FFFFFF;
    letter-spacing: 0.01em;
    text-transform: uppercase;
  }

  /* ── ZONA BASE ~520px ── */
  .zone-base {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    gap: 24px;
  }

  .footer {
    text-align: center;
    padding: 36px 60px;
    background: rgba(22,195,204,0.08);
    border: 1px solid rgba(22,195,204,0.2);
    border-radius: 100px;
    width: 100%;
  }

  .footer-text {
    font-family: 'Inter', sans-serif;
    font-size: 28px;
    color: #A0AEC0;
  }

  .footer-text strong {
    color: #16C3CC;
  }

  .footer-url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #16C3CC;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="story">

  <!-- TOPO -->
  <div class="zone-top">
    <div class="logo">SmartGuest</div>
    <div class="tag">Enquete</div>
  </div>

  <!-- MEIO -->
  <div class="zone-mid">
    <h1 class="question">QUANTO TEMPO VOCÊ PERDE POR DIA <span>GERENCIANDO RESERVAS?</span></h1>

    <div class="options">
      <div class="option">
        <div class="option-dot"></div>
        <span class="option-text">Menos de 1h</span>
      </div>
      <div class="option">
        <div class="option-dot"></div>
        <span class="option-text">1 a 2 horas</span>
      </div>
      <div class="option">
        <div class="option-dot"></div>
        <span class="option-text">2 a 4 horas</span>
      </div>
      <div class="option" style="border-color: rgba(22,195,204,0.6); background: rgba(22,195,204,0.07);">
        <div class="option-dot" style="border-color: #16C3CC;"></div>
        <span class="option-text" style="color: #16C3CC;">Mais de 4h</span>
      </div>
    </div>
  </div>

  <!-- BASE -->
  <div class="zone-base">
    <div class="footer">
      <div class="footer-text">Com SmartGuest: <strong>menos de 20min por dia.</strong></div>
      <div class="footer-url">smartguest.app</div>
    </div>
  </div>

</div>
</body>
</html>
