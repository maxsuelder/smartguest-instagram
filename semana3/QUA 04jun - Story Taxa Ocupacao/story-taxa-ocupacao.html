<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;background:#060E12;font-family:'Inter',sans-serif;overflow:hidden;}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#060E12 0%,#0A1220 50%,#060E12 100%);}
.glow-top{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(ellipse,rgba(168,85,247,0.09),transparent 65%);}
.glow-bot{position:absolute;bottom:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(ellipse,rgba(22,195,204,0.07),transparent 65%);}
.bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#A855F7,#16C3CC);}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 64px;text-align:center;z-index:5;}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:4px;color:#16C3CC;text-transform:uppercase;margin-bottom:52px;}
.icon{font-size:88px;margin-bottom:28px;line-height:1;}
.question{font-family:'Barlow Condensed',sans-serif;font-size:68px;font-weight:900;text-transform:uppercase;line-height:0.92;color:#FFF;margin-bottom:20px;}
.question .purple{color:#A855F7;}
.sub{font-size:23px;font-weight:500;color:rgba(184,205,211,0.6);line-height:1.5;margin-bottom:52px;}
.sub strong{color:#FFF;}
.options{width:100%;display:flex;flex-direction:column;gap:16px;}
.opt{border-radius:20px;padding:24px 36px;font-size:21px;font-weight:800;display:flex;align-items:center;gap:16px;text-align:left;}
.opt.a{background:rgba(168,85,247,0.1);border:2px solid rgba(168,85,247,0.35);color:#C084FC;}
.opt.b{background:rgba(22,195,204,0.08);border:2px solid rgba(22,195,204,0.25);color:#16C3CC;}
.opt.c{background:rgba(255,69,69,0.08);border:2px solid rgba(255,69,69,0.2);color:#FF6B6B;}
.opt.d{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.1);color:rgba(184,205,211,0.7);}
.opt-icon{font-size:26px;flex-shrink:0;}
.handle{position:absolute;bottom:48px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(184,205,211,0.2);text-transform:uppercase;z-index:5;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-top"></div>
<div class="glow-bot"></div>
<div class="bar-top"></div>

<div class="content">
  <div class="brand">smartguest</div>
  <div class="icon">📊</div>
  <div class="question">VOCÊ SABE<br/>A <span class="purple">TAXA DE<br/>OCUPAÇÃO</span><br/>DA SUA<br/>POUSADA<br/>HOJE?</div>
  <p class="sub">Sem esse número, <strong>não dá pra tomar decisão</strong> sobre preço, equipe ou investimento.</p>
  <div class="options">
    <div class="opt a"><span class="opt-icon">📱</span> Sim — abro meu sistema agora</div>
    <div class="opt b"><span class="opt-icon">🧮</span> Calculo na planilha, demora</div>
    <div class="opt c"><span class="opt-icon">🤔</span> Tenho ideia, mas não exato</div>
    <div class="opt d"><span class="opt-icon">❌</span> Não sei / não acompanho</div>
  </div>
</div>

<div class="handle">@smartguest.app</div>
</body>
</html>
