name: SmartGuest — Semana 6

on:
  schedule:
    - cron: '0 13 18 6 *'   # seg 18/06 10h BRT
    - cron: '0 22 18 6 *'   # seg 18/06 19h BRT
    - cron: '0 13 19 6 *'   # ter 19/06 10h BRT
    - cron: '0 22 19 6 *'   # ter 19/06 19h BRT
    - cron: '0 13 20 6 *'   # qua 20/06 10h BRT
    - cron: '0 22 20 6 *'   # qua 20/06 19h BRT
    - cron: '0 13 21 6 *'   # qui 21/06 10h BRT
    - cron: '0 22 21 6 *'   # qui 21/06 19h BRT
    - cron: '0 13 22 6 *'   # sex 22/06 10h BRT
    - cron: '0 22 22 6 *'   # sex 22/06 19h BRT
    # backups +20min
    - cron: '20 13 18 6 *'
    - cron: '20 22 18 6 *'
    - cron: '20 13 19 6 *'
    - cron: '20 22 19 6 *'
    - cron: '20 13 20 6 *'
    - cron: '20 22 20 6 *'
    - cron: '20 13 21 6 *'
    - cron: '20 22 21 6 *'
    - cron: '20 13 22 6 *'
    - cron: '20 22 22 6 *'
    # backups +40min
    - cron: '40 13 18 6 *'
    - cron: '40 22 18 6 *'
    - cron: '40 13 19 6 *'
    - cron: '40 22 19 6 *'
    - cron: '40 13 20 6 *'
    - cron: '40 22 20 6 *'
    - cron: '40 13 21 6 *'
    - cron: '40 22 21 6 *'
    - cron: '40 13 22 6 *'
    - cron: '40 22 22 6 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

concurrency:
  group: smartguest-semana6
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT; exit 0
          fi
          DIA=$(date -u +"%m-%d"); HORA=$(date -u +"%H")
          case "${DIA}-${HORA}" in
            "06-18-13") POST_ID="seg18-carousel-link" ;;
            "06-18-22") POST_ID="seg18-story-avaliacao" ;;
            "06-19-13") POST_ID="ter19-carousel-recepcionista" ;;
            "06-19-22") POST_ID="ter19-story-motor" ;;
            "06-20-13") POST_ID="qua20-carousel-hospede" ;;
            "06-20-22") POST_ID="qua20-story-bastidores" ;;
            "06-21-13") POST_ID="qui21-carousel-metricas" ;;
            "06-21-22") POST_ID="qui21-story-dificuldade" ;;
            "06-22-13") POST_ID="sex22-carousel-pequenas" ;;
            "06-22-22") POST_ID="sex22-story-cta" ;;
            *) echo "⏭️  Backup ignorado."; echo "id=" >> $GITHUB_OUTPUT; exit 0 ;;
          esac
          echo "id=${POST_ID}" >> $GITHUB_OUTPUT

      - name: Verificar cache (anti-dupla)
        id: cache
        if: steps.post.outputs.id != ''
        uses: actions/cache@v4
        with:
          path: .cache-posted
          key: posted-${{ steps.post.outputs.id }}

      - name: Setup Node.js
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Instalar Playwright
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Publicar no Instagram
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}

      - name: Marcar como publicado
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p .cache-posted && echo "ok" > .cache-posted/${{ steps.post.outputs.id }}
