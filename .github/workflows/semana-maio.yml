name: SmartGuest — Maio 2026

on:
  schedule:
    # ── PRIMÁRIOS (horário exato) ──────────────────────────
    - cron: '0 13 20 5 *'   # ter 20/05 10h BRT
    - cron: '0 22 20 5 *'   # ter 20/05 19h BRT
    - cron: '0 13 21 5 *'   # qua 21/05 10h BRT
    - cron: '0 22 21 5 *'   # qua 21/05 19h BRT
    - cron: '0 13 22 5 *'   # qui 22/05 10h BRT
    - cron: '0 22 22 5 *'   # qui 22/05 19h BRT
    - cron: '0 13 23 5 *'   # sex 23/05 10h BRT
    - cron: '0 22 23 5 *'   # sex 23/05 19h BRT
    - cron: '0 13 26 5 *'   # seg 26/05 10h BRT
    - cron: '0 22 26 5 *'   # seg 26/05 19h BRT
    - cron: '0 13 27 5 *'   # ter 27/05 10h BRT
    - cron: '0 22 27 5 *'   # ter 27/05 19h BRT
    - cron: '0 13 28 5 *'   # qua 28/05 10h BRT
    - cron: '0 22 28 5 *'   # qua 28/05 19h BRT
    - cron: '0 13 29 5 *'   # qui 29/05 10h BRT
    - cron: '0 22 29 5 *'   # qui 29/05 19h BRT
    - cron: '0 13 30 5 *'   # sex 30/05 10h BRT
    - cron: '0 22 30 5 *'   # sex 30/05 19h BRT
    # ── BACKUP +20min (caso GitHub atrase o primário) ──────
    - cron: '20 13 20 5 *'
    - cron: '20 22 20 5 *'
    - cron: '20 13 21 5 *'
    - cron: '20 22 21 5 *'
    - cron: '20 13 22 5 *'
    - cron: '20 22 22 5 *'
    - cron: '20 13 23 5 *'
    - cron: '20 22 23 5 *'
    - cron: '20 13 26 5 *'
    - cron: '20 22 26 5 *'
    - cron: '20 13 27 5 *'
    - cron: '20 22 27 5 *'
    - cron: '20 13 28 5 *'
    - cron: '20 22 28 5 *'
    - cron: '20 13 29 5 *'
    - cron: '20 22 29 5 *'
    - cron: '20 13 30 5 *'
    - cron: '20 22 30 5 *'
    # ── BACKUP +40min ──────────────────────────────────────
    - cron: '40 13 20 5 *'
    - cron: '40 22 20 5 *'
    - cron: '40 13 21 5 *'
    - cron: '40 22 21 5 *'
    - cron: '40 13 22 5 *'
    - cron: '40 22 22 5 *'
    - cron: '40 13 23 5 *'
    - cron: '40 22 23 5 *'
    - cron: '40 13 26 5 *'
    - cron: '40 22 26 5 *'
    - cron: '40 13 27 5 *'
    - cron: '40 22 27 5 *'
    - cron: '40 13 28 5 *'
    - cron: '40 22 28 5 *'
    - cron: '40 13 29 5 *'
    - cron: '40 22 29 5 *'
    - cron: '40 13 30 5 *'
    - cron: '40 22 30 5 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

# Serializa execuções do mesmo workflow — uma por vez, sem paralelo
concurrency:
  group: smartguest-maio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIA=$(date -u +"%m-%d")
          HORA=$(date -u +"%H")

          case "${DIA}-${HORA}" in
            "05-20-13") POST_ID="ter20-carousel-hospede-volta" ;;
            "05-20-22") POST_ID="ter20-story-rate-parity" ;;
            "05-21-13") POST_ID="qua21-carousel-custo-reserva" ;;
            "05-21-22") POST_ID="qua21-story-planilha" ;;
            "05-22-13") POST_ID="qui22-carousel-checkin" ;;
            "05-22-22") POST_ID="qui22-story-setup" ;;
            "05-23-13") POST_ID="sex23-carousel-corpus" ;;
            "05-23-22") POST_ID="sex23-story-avaliacoes" ;;
            "05-26-13") POST_ID="seg26-carousel-booking" ;;
            "05-26-22") POST_ID="seg26-story-quiz" ;;
            "05-27-13") POST_ID="ter27-carousel-revenue" ;;
            "05-27-22") POST_ID="ter27-story-depoimento" ;;
            "05-28-13") POST_ID="qua28-carousel-erro" ;;
            "05-28-22") POST_ID="qua28-story-precos" ;;
            "05-29-13") POST_ID="qui29-carousel-comparacao" ;;
            "05-29-22") POST_ID="qui29-story-tempo" ;;
            "05-30-13") POST_ID="sex30-carousel-junho" ;;
            "05-30-22") POST_ID="sex30-story-cta" ;;
            *)
              echo "⏭️  Nenhum post para $DIA às $HORA UTC — backup ignorado."
              echo "id=" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          echo "id=${POST_ID}" >> $GITHUB_OUTPUT

      # Cache com chave = post ID: se o cache existe, esse post já foi publicado
      - name: Verificar se já foi publicado (cache)
        id: cache
        if: steps.post.outputs.id != ''
        uses: actions/cache@v4
        with:
          path: .cache-posted
          key: posted-${{ steps.post.outputs.id }}

      - name: Pular se já publicado
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "✅ '${{ steps.post.outputs.id }}' já foi publicado anteriormente. Pulando."
          exit 0

      - name: Setup Node.js
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Instalar Playwright (Chromium)
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Publicar no Instagram
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}

      # Salva o marker APÓS publicar com sucesso — backups vão ver o cache e pular
      - name: Marcar como publicado (cache)
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p .cache-posted && echo "ok" > .cache-posted/${{ steps.post.outputs.id }}
