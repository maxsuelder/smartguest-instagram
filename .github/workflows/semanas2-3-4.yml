name: SmartGuest — Semanas 2, 3 e 4

on:
  schedule:
    # ── SEMANA 2 (maio) — desativada, semana-maio.yml gerencia 23-30/05 ────────

    # ── SEMANA 3 ────────────────────────────────────────
    # ter 31/05 às 11h BRT = 14h UTC (não conflita com semana-maio)
    - cron: '0 14 31 5 *'
    # qua 01/06 às 11h BRT = 14h UTC
    - cron: '0 14 1 6 *'
    # qui 02/06 às 11h BRT = 14h UTC
    - cron: '0 14 2 6 *'
    # sex 03/06 às 11h BRT = 14h UTC
    - cron: '0 14 3 6 *'

    # ── SEMANA 4 ────────────────────────────────────────
    # seg 06/06 às 10h BRT = 13h UTC
    - cron: '0 13 6 6 *'
    # ter 07/06 às 11h BRT = 14h UTC
    - cron: '0 14 7 6 *'
    # qua 08/06 às 11h BRT = 14h UTC
    - cron: '0 14 8 6 *'
    # qui 09/06 às 11h BRT = 14h UTC
    - cron: '0 14 9 6 *'
    # sex 10/06 às 11h BRT = 14h UTC
    - cron: '0 14 10 6 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIA=$(date -u +"%m-%d")
          case "$DIA" in
            # Semana 2
            "05-23") echo "id=seg23-carousel-mapa"    >> $GITHUB_OUTPUT ;;
            "05-24") echo "id=ter24-carousel-setup"   >> $GITHUB_OUTPUT ;;
            "05-25") echo "id=qua25-story-trabalho"   >> $GITHUB_OUTPUT ;;
            "05-26") echo "id=qui26-carousel-ia"      >> $GITHUB_OUTPUT ;;
            "05-27") echo "id=sex27-post-dado"        >> $GITHUB_OUTPUT ;;
            # Semana 3
            "05-30") echo "id=seg30-story-clientes"   >> $GITHUB_OUTPUT ;;
            "05-31") echo "id=ter31-carousel-case"    >> $GITHUB_OUTPUT ;;
            "06-01") echo "id=qua01-post-depoimento"  >> $GITHUB_OUTPUT ;;
            "06-02") echo "id=qui02-story-teste"      >> $GITHUB_OUTPUT ;;
            "06-03") echo "id=sex03-carousel-faq"     >> $GITHUB_OUTPUT ;;
            # Semana 4
            "06-06") echo "id=seg06-carousel-ia2026"  >> $GITHUB_OUTPUT ;;
            "06-07") echo "id=ter07-carousel-channel" >> $GITHUB_OUTPUT ;;
            "06-08") echo "id=qua08-story-quiz"       >> $GITHUB_OUTPUT ;;
            "06-09") echo "id=qui09-post-comparativo" >> $GITHUB_OUTPUT ;;
            "06-10") echo "id=sex10-post-cta"         >> $GITHUB_OUTPUT ;;
            *)
              echo "Nenhum post agendado para $DIA"
              exit 1
              ;;
          esac

      - name: Publicar no Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}
