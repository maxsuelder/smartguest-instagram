<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;background:#060E12;font-family:'Inter',sans-serif;overflow:hidden;}
.bg{position:absolute;inset:0;background:linear-gradient(160deg,#060E12 0%,#0A1A1F 50%,#060E12 100%);}
.glow-top{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(ellipse,rgba(255,69,69,0.1),transparent 65%);}
.glow-bot{position:absolute;bottom:-200px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(ellipse,rgba(22,195,204,0.07),transparent 65%);}
.bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#FF4545,#16C3CC);}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 64px;text-align:center;z-index:5;}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:4px;color:#16C3CC;text-transform:uppercase;margin-bottom:60px;}
.icon{font-size:88px;margin-bottom:32px;line-height:1;}
.question{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:900;text-transform:uppercase;line-height:0.92;color:#FFF;margin-bottom:20px;}
.question .red{color:#FF4545;}
.sub{font-size:24px;font-weight:500;color:rgba(184,205,211,0.6);line-height:1.5;margin-bottom:56px;}
.sub strong{color:#FFF;}
.options{width:100%;display:flex;flex-direction:column;gap:18px;}
.opt{border-radius:20px;padding:26px 36px;font-size:22px;font-weight:800;display:flex;align-items:center;gap:16px;text-align:left;}
.opt.red{background:rgba(255,69,69,0.1);border:2px solid rgba(255,69,69,0.35);color:#FF6B6B;}
.opt.teal{background:rgba(22,195,204,0.08);border:2px solid rgba(22,195,204,0.25);color:#16C3CC;}
.opt.grey{background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.1);color:rgba(184,205,211,0.7);}
.opt-icon{font-size:28px;flex-shrink:0;}
.handle{position:absolute;bottom:48px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:3px;color:rgba(184,205,211,0.2);text-transform:uppercase;z-index:5;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="glow-top"></div>
<div class="glow-bot"></div>
<div class="bar-top"></div>

<div class="content">
  <div class="brand">smartguest</div>
  <div class="icon">😱</div>
  <div class="question">VOCÊ JÁ TEVE<br/><span class="red">OVERBOOKING</span><br/>NA SUA<br/>POUSADA?</div>
  <p class="sub">Dois hóspedes, <strong>um quarto</strong> — o pior momento da recepção.</p>
  <div class="options">
    <div class="opt red"><span class="opt-icon">🔴</span> Sim, já aconteceu comigo</div>
    <div class="opt grey"><span class="opt-icon">😅</span> Quase, mas consegui resolver</div>
    <div class="opt teal"><span class="opt-icon">✅</span> Nunca — tenho sistema</div>
    <div class="opt grey"><span class="opt-icon">🤞</span> Nunca — torço pra não ter</div>
  </div>
</div>

<div class="handle">@smartguest.app</div>
</body>
</html>
