<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGuest — Story Enquete Quartos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;display:flex;align-items:flex-start;justify-content:center;padding:24px;font-family:'Inter',sans-serif;}
  .story{
    width:1080px;height:1920px;background:#060E12;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  /* Elementos fixos */
  .bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#16C3CC,#0a8a91,transparent);}
  .bar-left{position:absolute;top:0;left:0;width:8px;height:100%;background:linear-gradient(180deg,#16C3CC 0%,#0a8a91 40%,transparent 100%);}
  .glow{position:absolute;border-radius:50%;pointer-events:none;}
  .brand{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;
    color:#16C3CC;letter-spacing:3px;text-transform:lowercase;opacity:.9;
    white-space:nowrap;
  }
  .footer{
    position:absolute;bottom:60px;left:0;right:0;text-align:center;
    font-size:24px;color:rgba(255,255,255,0.3);
  }
  /* Conteúdo */
  .card{
    width:860px;background:rgba(255,255,255,0.03);
    border:1px solid rgba(22,195,204,0.2);border-radius:24px;
    padding:64px 56px;text-align:center;position:relative;z-index:2;
  }
  .tag{
    display:inline-block;background:rgba(22,195,204,0.15);border:1px solid rgba(22,195,204,0.4);
    color:#16C3CC;font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
    padding:10px 28px;border-radius:6px;margin-bottom:40px;
    font-family:'Barlow Condensed',sans-serif;
  }
  h2{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#fff;
    font-size:88px;line-height:1.0;text-transform:uppercase;margin-bottom:16px;
  }
  .subtitle{color:rgba(255,255,255,0.55);font-size:28px;line-height:1.5;margin-bottom:56px;}
  .accent{color:#16C3CC;}
  .options{display:flex;flex-direction:column;gap:20px;}
  .option{
    background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);
    border-radius:16px;padding:28px 40px;
    display:flex;align-items:center;gap:24px;cursor:pointer;
    transition:all .2s;
  }
  .option-letter{
    width:52px;height:52px;border-radius:50%;
    background:rgba(22,195,204,0.15);border:2px solid rgba(22,195,204,0.4);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;
    color:#16C3CC;flex-shrink:0;
  }
  .option-text{color:#fff;font-size:28px;font-weight:500;text-align:left;}
  .divider{width:80px;height:4px;background:#16C3CC;margin:40px auto;border-radius:2px;}
  .icon-large{font-size:80px;margin-bottom:24px;line-height:1;}
</style>
</head>
<body>

<div class="story">
  <div class="bar-top"></div>
  <div class="bar-left"></div>
  <!-- Glows -->
  <div class="glow" style="width:900px;height:900px;top:-200px;right:-200px;background:radial-gradient(circle,rgba(22,195,204,0.12) 0%,transparent 70%);"></div>
  <div class="glow" style="width:700px;height:700px;bottom:-100px;left:-100px;background:radial-gradient(circle,rgba(22,195,204,0.08) 0%,transparent 70%);"></div>
  <div class="brand">smartguest</div>

  <div class="card">
    <div class="tag">Enquete</div>
    <div style="font-size:90px;line-height:1;margin-bottom:20px;">🏨</div>
    <h2>Quantos<br><span class="accent">quartos</span><br>tem sua<br>pousada?</h2>
    <div class="divider"></div>
    <p class="subtitle">Conta pra gente — a resposta<br>pode surpreender você</p>
    <div class="options">
      <div class="option">
        <div class="option-letter">A</div>
        <span class="option-text">1 a 5 quartos</span>
      </div>
      <div class="option">
        <div class="option-letter">B</div>
        <span class="option-text">6 a 15 quartos</span>
      </div>
      <div class="option">
        <div class="option-letter">C</div>
        <span class="option-text">16 a 30 quartos</span>
      </div>
      <div class="option">
        <div class="option-letter">D</div>
        <span class="option-text">Mais de 30 quartos</span>
      </div>
    </div>
  </div>

  <div class="footer">@smartguest.app | smartguest.app</div>
</div>

</body>
</html>
