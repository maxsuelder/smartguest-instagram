name: SmartGuest — Maio 2026

on:
  schedule:
    # ── PRIMÁRIOS (horário exato) ──────────────────────────
    - cron: '0 13 20 5 *'   # ter 20/05 10h BRT
    - cron: '0 22 20 5 *'   # ter 20/05 19h BRT
    - cron: '0 13 21 5 *'   # qua 21/05 10h BRT
    - cron: '0 22 21 5 *'   # qua 21/05 19h BRT
    - cron: '0 13 22 5 *'   # qui 22/05 10h BRT
    - cron: '0 22 22 5 *'   # qui 22/05 19h BRT
    - cron: '0 13 23 5 *'   # sex 23/05 10h BRT
    - cron: '0 22 23 5 *'   # sex 23/05 19h BRT
    - cron: '0 13 24 5 *'   # sab 24/05 10h BRT
    - cron: '0 22 24 5 *'   # sab 24/05 19h BRT (story no sábado)
    - cron: '0 13 25 5 *'   # dom 25/05 10h BRT
    - cron: '0 13 26 5 *'   # seg 26/05 10h BRT
    - cron: '0 22 26 5 *'   # seg 26/05 19h BRT
    - cron: '0 13 27 5 *'   # ter 27/05 10h BRT
    - cron: '0 22 27 5 *'   # ter 27/05 19h BRT
    - cron: '0 13 28 5 *'   # qua 28/05 10h BRT
    - cron: '0 22 28 5 *'   # qua 28/05 19h BRT
    - cron: '0 13 29 5 *'   # qui 29/05 10h BRT
    - cron: '0 22 29 5 *'   # qui 29/05 19h BRT
    - cron: '0 13 30 5 *'   # sex 30/05 10h BRT
    - cron: '0 22 30 5 *'   # sex 30/05 19h BRT
    # ── BACKUP +20min (caso GitHub atrase o primário) ──────
    - cron: '20 13 20 5 *'
    - cron: '20 22 20 5 *'
    - cron: '20 13 21 5 *'
    - cron: '20 22 21 5 *'
    - cron: '20 13 22 5 *'
    - cron: '20 22 22 5 *'
    - cron: '20 13 23 5 *'
    - cron: '20 22 23 5 *'
    - cron: '20 13 24 5 *'
    - cron: '20 22 24 5 *'
    - cron: '20 13 26 5 *'
    - cron: '20 22 26 5 *'
    - cron: '20 13 27 5 *'
    - cron: '20 22 27 5 *'
    - cron: '20 13 28 5 *'
    - cron: '20 22 28 5 *'
    - cron: '20 13 29 5 *'
    - cron: '20 22 29 5 *'
    - cron: '20 13 30 5 *'
    - cron: '20 22 30 5 *'
    # ── BACKUP +40min ──────────────────────────────────────
    - cron: '40 13 20 5 *'
    - cron: '40 22 20 5 *'
    - cron: '40 13 21 5 *'
    - cron: '40 22 21 5 *'
    - cron: '40 13 22 5 *'
    - cron: '40 22 22 5 *'
    - cron: '40 13 23 5 *'
    - cron: '40 22 23 5 *'
    - cron: '40 13 24 5 *'
    - cron: '40 22 24 5 *'
    - cron: '40 13 26 5 *'
    - cron: '40 22 26 5 *'
    - cron: '40 13 27 5 *'
    - cron: '40 22 27 5 *'
    - cron: '40 13 28 5 *'
    - cron: '40 22 28 5 *'
    - cron: '40 13 29 5 *'
    - cron: '40 22 29 5 *'
    - cron: '40 13 30 5 *'
    - cron: '40 22 30 5 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

# Serializa execuções do mesmo workflow — uma por vez, sem paralelo
concurrency:
  group: smartguest-maio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIA=$(date -u +"%m-%d")
          HORA=$(date -u +"%H")

          # Janelas tolerantes ao atraso do GitHub Actions (crons podem atrasar 1-3h):
          # Manhã  = 10h BRT = 13h UTC → aceita 12h-18h UTC
          # Noite  = 19h BRT = 22h UTC → aceita 21h-04h UTC (cruza meia-noite)
          MANHA=0; NOITE=0
          if [ "$HORA" -ge 12 ] && [ "$HORA" -le 18 ]; then MANHA=1; fi
          if [ "$HORA" -ge 21 ] || [ "$HORA" -le 4 ];  then NOITE=1; fi

          POST_ID=""
          case "$DIA" in
            "05-20") [ $MANHA -eq 1 ] && POST_ID="ter20-carousel-hospede-volta" || true
                     [ $NOITE -eq 1 ] && POST_ID="ter20-story-rate-parity"      || true ;;
            "05-21") [ $MANHA -eq 1 ] && POST_ID="qua21-carousel-custo-reserva" || true
                     [ $NOITE -eq 1 ] && POST_ID="qua21-story-planilha"         || true ;;
            "05-22") [ $MANHA -eq 1 ] && POST_ID="qui22-carousel-checkin"       || true
                     [ $NOITE -eq 1 ] && POST_ID="qui22-story-setup"            || true ;;
            "05-23") [ $MANHA -eq 1 ] && POST_ID="sex23-reels-burocracia"        || true
                     [ $NOITE -eq 1 ] && POST_ID="sex23-story-noite-recepcao"   || true ;;
            "05-24") [ $MANHA -eq 1 ] && POST_ID="sab24-reels-atitude-branco"  || true
                     [ $NOITE -eq 1 ] && POST_ID="sab24-story-tarde-ia"         || true ;;
            "05-25") [ $MANHA -eq 1 ] && POST_ID="dom25-reels-fimdesemana"      || true ;;
            "05-26") [ $MANHA -eq 1 ] && POST_ID="seg26-reels-ia-operacional"    || true
                     [ $NOITE -eq 1 ] && POST_ID="seg26-story-quiz"             || true ;;
            "05-27") [ $MANHA -eq 1 ] && POST_ID="ter27-carousel-revenue"       || true
                     [ $NOITE -eq 1 ] && POST_ID="ter27-story-depoimento"       || true ;;
            "05-28") [ $MANHA -eq 1 ] && POST_ID="qua28-carousel-erro"          || true
                     [ $NOITE -eq 1 ] && POST_ID="qua28-story-precos"           || true ;;
            "05-29") [ $MANHA -eq 1 ] && POST_ID="qui29-carousel-comparacao"    || true
                     [ $NOITE -eq 1 ] && POST_ID="qui29-story-tempo"            || true ;;
            "05-30") [ $MANHA -eq 1 ] && POST_ID="sex30-carousel-junho"         || true
                     [ $NOITE -eq 1 ] && POST_ID="sex30-story-cta"              || true ;;
            *)
              echo "⏭️  Nenhum post para $DIA — ignorado."
              echo "id=" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          if [ -z "$POST_ID" ]; then
            echo "⏭️  $DIA às ${HORA}h UTC — fora das janelas manhã/noite. Ignorado."
            echo "id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Post identificado: $POST_ID ($DIA às ${HORA}h UTC)"
          echo "id=${POST_ID}" >> $GITHUB_OUTPUT

      # Cache com chave = post ID: se o cache existe, esse post já foi publicado
      - name: Verificar se já foi publicado (cache)
        id: cache
        if: steps.post.outputs.id != ''
        uses: actions/cache@v4
        with:
          path: .cache-posted
          key: posted-${{ steps.post.outputs.id }}

      - name: Pular se já publicado
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "✅ '${{ steps.post.outputs.id }}' já foi publicado anteriormente. Pulando."
          exit 0

      - name: Setup Node.js
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Instalar Playwright (Chromium)
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Publicar no Instagram
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}

      # Salva o marker APÓS publicar com sucesso — backups vão ver o cache e pular
      - name: Marcar como publicado (cache)
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p .cache-posted && echo "ok" > .cache-posted/${{ steps.post.outputs.id }}
