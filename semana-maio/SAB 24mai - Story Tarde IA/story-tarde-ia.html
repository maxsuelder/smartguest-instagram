<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#060E12;font-family:'Inter',sans-serif;}
.slide{width:1080px;height:1920px;overflow:hidden;position:relative;background:linear-gradient(160deg,#060E12 0%,#081218 50%,#060E12 100%);}
.noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:10;}
.glow{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:1000px;height:900px;background:radial-gradient(ellipse,rgba(22,195,204,.08),transparent 65%);pointer-events:none;}
.bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#16C3CC,rgba(22,195,204,.3),transparent);z-index:20;}
.brand{position:absolute;top:64px;left:64px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:4px;color:#16C3CC;text-transform:uppercase;z-index:20;}

.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:160px 72px;z-index:5;text-align:center;gap:32px;}

.chip{display:inline-flex;align-items:center;gap:10px;background:rgba(22,195,204,.06);border:1px solid rgba(22,195,204,.2);border-radius:100px;padding:12px 28px;}
.chip-dot{width:8px;height:8px;border-radius:50%;background:#16C3CC;box-shadow:0 0 8px #16C3CC;}
.chip-txt{font-size:13px;font-weight:700;letter-spacing:4px;color:#16C3CC;text-transform:uppercase;}

.h1{font-family:'Barlow Condensed',sans-serif;font-size:112px;font-weight:900;text-transform:uppercase;line-height:.83;color:#fff;}
.h1 em{color:#16C3CC;font-style:normal;}

.cards{width:100%;display:flex;flex-direction:column;gap:14px;}
.card{display:flex;align-items:center;gap:20px;padding:24px 28px;background:rgba(22,195,204,.04);border:1px solid rgba(22,195,204,.1);border-radius:16px;text-align:left;}
.card-icon{font-size:28px;width:52px;height:52px;border-radius:12px;background:rgba(22,195,204,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-text{font-size:19px;font-weight:600;color:rgba(184,205,211,.85);line-height:1.4;}
.card-text strong{color:#fff;}

.bottom-txt{font-size:26px;font-weight:700;color:rgba(184,205,211,.55);line-height:1.55;text-align:center;}
.bottom-txt em{color:#16C3CC;font-style:normal;}

.cta-box{position:absolute;bottom:90px;left:72px;right:72px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px;}
.cta-btn{background:#16C3CC;color:#030a0d;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:24px 64px;border-radius:100px;}
.cta-sub{font-size:14px;font-weight:600;letter-spacing:3px;color:rgba(22,195,204,.3);text-transform:uppercase;}
</style>
</head>
<body>
<div class="slide" id="story">
  <div class="noise"></div>
  <div class="bar-top"></div>
  <div class="glow"></div>
  <div class="brand">SmartGuest</div>

  <div class="content">
    <div class="chip">
      <div class="chip-dot"></div>
      <div class="chip-txt">IA trabalhando agora</div>
    </div>

    <div class="h1">ENQUANTO<br>VOCÊ<br><em>DESCANSA,</em><br>A IA<br>TRABALHA.</div>

    <div class="cards">
      <div class="card">
        <div class="card-icon">🌙</div>
        <div class="card-text"><strong>Nova reserva</strong> confirmada automaticamente</div>
      </div>
      <div class="card">
        <div class="card-icon">📊</div>
        <div class="card-text"><strong>Preços ajustados</strong> pela demanda em tempo real</div>
      </div>
      <div class="card">
        <div class="card-icon">🔄</div>
        <div class="card-text"><strong>OTAs sincronizadas</strong> — zero overbooking</div>
      </div>
    </div>

    <div class="bottom-txt">
      Seu recepcionista livre<br>para <em>encantar o hóspede.</em>
    </div>
  </div>

  <div class="cta-box">
    <div class="cta-btn">smartguest.app</div>
    <div class="cta-sub">@smartguest.app · WhatsApp na bio</div>
  </div>
</div>
</body>
</html>
