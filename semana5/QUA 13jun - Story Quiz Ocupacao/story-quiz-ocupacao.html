<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGuest — Story Quiz Ocupação</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;display:flex;align-items:flex-start;justify-content:center;padding:24px;font-family:'Inter',sans-serif;}
  .story{
    width:1080px;height:1920px;background:#060E12;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#16C3CC,#0a8a91,transparent);}
  .bar-left{position:absolute;top:0;left:0;width:8px;height:100%;background:linear-gradient(180deg,#16C3CC 0%,#0a8a91 40%,transparent 100%);}
  .glow{position:absolute;border-radius:50%;pointer-events:none;}
  .brand{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;color:#16C3CC;letter-spacing:3px;text-transform:lowercase;opacity:.9;white-space:nowrap;}
  .footer{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:24px;color:rgba(255,255,255,0.3);}
  .accent{color:#16C3CC;}
  .tag{display:inline-block;background:rgba(22,195,204,0.15);border:1px solid rgba(22,195,204,0.4);color:#16C3CC;font-size:22px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:10px 28px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:#fff;font-size:84px;line-height:1.0;text-transform:uppercase;}
  .divider{width:80px;height:4px;background:#16C3CC;margin:36px auto;border-radius:2px;}
  .option{
    width:100%;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.12);
    border-radius:16px;padding:28px 40px;
    display:flex;align-items:center;gap:24px;
  }
  .option-letter{
    width:56px;height:56px;border-radius:50%;
    background:rgba(22,195,204,0.15);border:2px solid rgba(22,195,204,0.4);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;
    color:#16C3CC;flex-shrink:0;
  }
  .option-text{color:#fff;font-size:26px;font-weight:500;text-align:left;line-height:1.3;}
</style>
</head>
<body>

<div class="story">
  <div class="bar-top"></div>
  <div class="bar-left"></div>
  <div class="glow" style="width:1000px;height:1000px;top:-300px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(22,195,204,0.12) 0%,transparent 70%);"></div>
  <div class="glow" style="width:700px;height:700px;bottom:-200px;right:-100px;background:radial-gradient(circle,rgba(22,195,204,0.08) 0%,transparent 70%);"></div>
  <div class="brand">smartguest</div>

  <div style="width:860px;position:relative;z-index:2;text-align:center;">
    <div class="tag">Quiz</div>
    <div style="font-size:96px;line-height:1;margin:28px 0 24px;">📊</div>
    <h2>Você sabe<br>sua taxa de<br><span class="accent">ocupação</span><br>do mês<br>passado?</h2>
    <div class="divider"></div>

    <div style="display:flex;flex-direction:column;gap:18px;">
      <div class="option" style="border-color:rgba(22,195,204,0.3);background:rgba(22,195,204,0.06);">
        <div class="option-letter">A</div>
        <span class="option-text">Sei exatamente — tenho sistema</span>
      </div>
      <div class="option">
        <div class="option-letter">B</div>
        <span class="option-text">Tenho uma ideia, mas não exata</span>
      </div>
      <div class="option" style="border-color:rgba(255,107,107,0.3);background:rgba(255,107,107,0.05);">
        <div class="option-letter" style="border-color:rgba(255,107,107,0.4);background:rgba(255,107,107,0.15);color:#ff6b6b;">C</div>
        <span class="option-text" style="color:rgba(255,255,255,0.7);">Não tenho como calcular</span>
      </div>
    </div>

    <div style="background:rgba(22,195,204,0.08);border:1px solid rgba(22,195,204,0.25);border-radius:16px;padding:28px 32px;margin-top:40px;text-align:left;">
      <p style="color:rgba(255,255,255,0.5);font-size:20px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">Por que importa</p>
      <p style="color:rgba(255,255,255,0.8);font-size:24px;line-height:1.4;">Taxa de ocupação é o KPI #1 da sua pousada. Sem ele, você gerencia no escuro.</p>
    </div>
  </div>

  <div class="footer">@smartguest.app | smartguest.app</div>
</div>

</body>
</html>
