<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGuest – CTA Final de Maio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030a0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #story {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    position: relative;
    background: #060E12;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
  }

  /* grain */
  #story::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  /* dramatic teal flood bottom */
  .glow-flood {
    position: absolute;
    bottom: -180px;
    left: 50%;
    transform: translateX(-50%);
    width: 1400px;
    height: 1000px;
    background: radial-gradient(ellipse, rgba(22,195,204,0.22) 0%, rgba(22,195,204,0.05) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* secondary glow top */
  .glow-top {
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 1000px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(22,195,204,0.1) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── ZONA TOPO ~300px ── */
  .zone-top {
    height: 300px;
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tag {
    display: inline-block;
    background: rgba(22,195,204,0.12);
    border: 1px solid rgba(22,195,204,0.4);
    color: #16C3CC;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 14px 36px;
    border-radius: 100px;
  }

  /* ── ZONA MEIO ~1100px ── */
  .zone-mid {
    flex: 1;
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 88px;
    text-align: center;
    gap: 0;
  }

  .main-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 220px;
    line-height: 0.85;
    color: #16C3CC;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    text-shadow:
      0 0 40px rgba(22,195,204,0.6),
      0 0 80px rgba(22,195,204,0.3),
      0 0 160px rgba(22,195,204,0.15);
    margin-bottom: 16px;
  }

  .subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 64px;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 56px;
  }

  .events-row {
    display: flex;
    gap: 16px;
    margin-bottom: 56px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .event-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 24px;
    padding: 14px 28px;
    border-radius: 100px;
  }

  .urgency-box {
    background: rgba(22,195,204,0.1);
    border: 2px solid rgba(22,195,204,0.4);
    border-radius: 28px;
    padding: 48px 56px;
    width: 100%;
  }

  .urgency-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 64px;
    color: #FFFFFF;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 16px;
  }

  .urgency-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 30px;
    color: #16C3CC;
    font-weight: 500;
  }

  /* ── ZONA BASE ~520px ── */
  .zone-base {
    height: 520px;
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 88px;
  }

  .cta-url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 88px;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .cta-whatsapp {
    font-family: 'Inter', sans-serif;
    font-size: 30px;
    color: #A0AEC0;
    font-weight: 500;
  }

  .logo-bottom {
    margin-top: 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: rgba(22,195,204,0.4);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="story">
  <div class="glow-flood"></div>
  <div class="glow-top"></div>

  <!-- TOPO -->
  <div class="zone-top">
    <div class="tag">Ultimo Dia de Maio</div>
  </div>

  <!-- MEIO -->
  <div class="zone-mid">
    <div class="main-title">JUNHO<br>É AQUI</div>
    <div class="subtitle">Copa do Mundo. Feriados.<br>Alta temporada.</div>

    <div class="events-row">
      <div class="event-pill">Copa do Mundo</div>
      <div class="event-pill">Corpus Christi</div>
      <div class="event-pill">Alta Temporada</div>
    </div>

    <div class="urgency-box">
      <div class="urgency-title">Seu hotel precisa estar pronto.</div>
      <div class="urgency-subtitle">Setup em 7 dias — ainda da tempo.</div>
    </div>
  </div>

  <!-- BASE -->
  <div class="zone-base">
    <div class="cta-url">smartguest.app</div>
    <div class="cta-whatsapp">Chama no WhatsApp agora</div>
    <div class="logo-bottom">SmartGuest</div>
  </div>

</div>
</body>
</html>
