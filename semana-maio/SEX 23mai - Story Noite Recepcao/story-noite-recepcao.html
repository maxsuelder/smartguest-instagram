<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#060E12;font-family:'Inter',sans-serif;}
.slide{width:1080px;height:1920px;overflow:hidden;position:relative;background:linear-gradient(160deg,#060E12 0%,#0A1820 60%,#060E12 100%);}
.noise{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:.4;pointer-events:none;z-index:10;}
.glow{position:absolute;top:30%;left:50%;transform:translateX(-50%);width:900px;height:900px;background:radial-gradient(ellipse,rgba(22,195,204,.09),transparent 65%);pointer-events:none;}
.bar-top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#16C3CC,transparent);z-index:20;}
.brand{position:absolute;top:64px;left:64px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:4px;color:#16C3CC;text-transform:uppercase;z-index:20;}

.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:160px 72px;z-index:5;text-align:center;}

.icon-wrap{width:120px;height:120px;border-radius:28px;background:rgba(22,195,204,.08);border:1px solid rgba(22,195,204,.2);display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:48px;}

.eyebrow{font-size:13px;font-weight:800;letter-spacing:6px;color:rgba(22,195,204,.6);text-transform:uppercase;margin-bottom:28px;}

.h1{font-family:'Barlow Condensed',sans-serif;font-size:108px;font-weight:900;text-transform:uppercase;line-height:.84;color:#fff;margin-bottom:36px;}
.h1 em{color:#16C3CC;font-style:normal;}

.divider{width:64px;height:3px;background:rgba(22,195,204,.4);border-radius:2px;margin-bottom:40px;}

.pergunta{font-size:32px;font-weight:700;color:#fff;line-height:1.45;margin-bottom:20px;}
.resposta{font-size:24px;font-weight:500;color:rgba(184,205,211,.6);line-height:1.55;}
.resposta strong{color:#16C3CC;}

.cta-box{position:absolute;bottom:100px;left:72px;right:72px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px;}
.cta-btn{background:#16C3CC;color:#030a0d;font-size:20px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:24px 64px;border-radius:100px;}
.cta-sub{font-size:15px;font-weight:600;letter-spacing:3px;color:rgba(22,195,204,.35);text-transform:uppercase;}
</style>
</head>
<body>
<div class="slide" id="story">
  <div class="noise"></div>
  <div class="bar-top"></div>
  <div class="glow"></div>
  <div class="brand">SmartGuest</div>

  <div class="content">
    <div class="icon-wrap">🛎️</div>
    <div class="eyebrow">Pergunta do dia</div>
    <div class="h1">SEU RECEP-<br>CIONISTA<br>TEM TEMPO<br>PRO<br><em>HÓSPEDE?</em></div>
    <div class="divider"></div>
    <div class="pergunta">Se a resposta for não —<br>o problema não é ele.</div>
    <div class="resposta">Com SmartGuest, a IA assume<br>a rotina e o recepcionista<br><strong>assume a experiência.</strong></div>
  </div>

  <div class="cta-box">
    <div class="cta-btn">smartguest.app</div>
    <div class="cta-sub">Setup em 7 dias · Suporte real</div>
  </div>
</div>
</body>
</html>
