<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGuest – Enquete Planilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030a0d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  #story {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    position: relative;
    background: #060E12;
    display: flex;
    flex-direction: column;
  }

  #story::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.35;
    pointer-events: none;
    z-index: 10;
  }

  /* ── ZONA TOPO ~300px ── */
  .zone-top {
    height: 300px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 88px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: #16C3CC;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .tag {
    background: rgba(22,195,204,0.12);
    border: 1px solid rgba(22,195,204,0.4);
    color: #16C3CC;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 100px;
  }

  /* ── ZONA MEIO ~1100px ── */
  .zone-mid {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
    padding: 0 80px;
    gap: 0;
  }

  .enquete-label {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 26px;
    color: #A0AEC0;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .question {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 96px;
    line-height: 0.95;
    color: #FFFFFF;
    text-transform: uppercase;
    margin-bottom: 72px;
  }

  /* split cards */
  .split {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 0;
  }

  .option-card {
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
  }

  .option-card.no {
    background: rgba(255,70,70,0.08);
    border: 2px solid rgba(255,70,70,0.25);
  }

  .option-card.yes {
    background: rgba(22,195,204,0.07);
    border: 2px solid rgba(22,195,204,0.3);
  }

  .option-emoji {
    font-size: 100px;
    line-height: 1;
  }

  .option-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 52px;
    text-align: center;
    line-height: 1.1;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  .option-card.no .option-text { color: #FF7070; }
  .option-card.yes .option-text { color: #16C3CC; }

  .vote-bar {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    margin-top: 12px;
  }

  .option-card.no .vote-bar { background: rgba(255,70,70,0.3); }
  .option-card.yes .vote-bar { background: rgba(22,195,204,0.3); }

  /* ── ZONA BASE ~520px ── */
  .zone-base {
    height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 88px;
    position: relative;
    z-index: 1;
    gap: 16px;
    text-align: center;
  }

  .bottom-msg p {
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    color: #FFFFFF;
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .bottom-msg .url {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="story">

  <!-- TOPO -->
  <div class="zone-top">
    <div class="logo">SmartGuest</div>
    <div class="tag">Enquete Rápida</div>
  </div>

  <!-- MEIO -->
  <div class="zone-mid">
    <div class="enquete-label">Pergunta do dia</div>
    <h1 class="question">Você ainda usa<br>planilha para<br>gerenciar reservas?</h1>

    <div class="split">
      <div class="option-card no">
        <div class="option-emoji">📊</div>
        <div class="option-text">SIM,<br>ainda uso</div>
        <div class="vote-bar"></div>
      </div>
      <div class="option-card yes">
        <div class="option-emoji">🚀</div>
        <div class="option-text">NÃO,<br>já evoluí</div>
        <div class="vote-bar"></div>
      </div>
    </div>
  </div>

  <!-- BASE -->
  <div class="zone-base">
    <div class="bottom-msg">
      <p>Se você votou SIM, a gente precisa conversar 👇</p>
      <div class="url">smartguest.app</div>
    </div>
  </div>

</div>
</body>
</html>
