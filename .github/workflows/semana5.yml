name: SmartGuest — Semana 5

on:
  schedule:
    - cron: '0 13 11 6 *'   # seg 11/06 10h BRT
    - cron: '0 22 11 6 *'   # seg 11/06 19h BRT
    - cron: '0 13 12 6 *'   # ter 12/06 10h BRT
    - cron: '0 22 12 6 *'   # ter 12/06 19h BRT
    - cron: '0 13 13 6 *'   # qua 13/06 10h BRT
    - cron: '0 22 13 6 *'   # qua 13/06 19h BRT
    - cron: '0 13 14 6 *'   # qui 14/06 10h BRT
    - cron: '0 22 14 6 *'   # qui 14/06 19h BRT
    - cron: '0 13 15 6 *'   # sex 15/06 10h BRT
    - cron: '0 22 15 6 *'   # sex 15/06 19h BRT
    # backups +20min
    - cron: '20 13 11 6 *'
    - cron: '20 22 11 6 *'
    - cron: '20 13 12 6 *'
    - cron: '20 22 12 6 *'
    - cron: '20 13 13 6 *'
    - cron: '20 22 13 6 *'
    - cron: '20 13 14 6 *'
    - cron: '20 22 14 6 *'
    - cron: '20 13 15 6 *'
    - cron: '20 22 15 6 *'
    # backups +40min
    - cron: '40 13 11 6 *'
    - cron: '40 22 11 6 *'
    - cron: '40 13 12 6 *'
    - cron: '40 22 12 6 *'
    - cron: '40 13 13 6 *'
    - cron: '40 22 13 6 *'
    - cron: '40 13 14 6 *'
    - cron: '40 22 14 6 *'
    - cron: '40 13 15 6 *'
    - cron: '40 22 15 6 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

concurrency:
  group: smartguest-semana5
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT; exit 0
          fi
          DIA=$(date -u +"%m-%d"); HORA=$(date -u +"%H")
          MANHA=0; NOITE=0
          if [ "$HORA" -ge 12 ] && [ "$HORA" -le 18 ]; then MANHA=1; fi
          if [ "$HORA" -ge 21 ] || [ "$HORA" -le 4 ];  then NOITE=1; fi
          POST_ID=""
          case "$DIA" in
            "06-11") [ $MANHA -eq 1 ] && POST_ID="seg11-carousel-whatsapp"   || true
                     [ $NOITE -eq 1 ] && POST_ID="seg11-story-quartos"        || true ;;
            "06-12") [ $MANHA -eq 1 ] && POST_ID="ter12-carousel-hospede"    || true
                     [ $NOITE -eq 1 ] && POST_ID="ter12-story-checkin"        || true ;;
            "06-13") [ $MANHA -eq 1 ] && POST_ID="qua13-carousel-avaliacao"  || true
                     [ $NOITE -eq 1 ] && POST_ID="qua13-story-quiz"           || true ;;
            "06-14") [ $MANHA -eq 1 ] && POST_ID="qui14-carousel-comissao"   || true
                     [ $NOITE -eq 1 ] && POST_ID="qui14-story-canal"          || true ;;
            "06-15") [ $MANHA -eq 1 ] && POST_ID="sex15-carousel-temporada"  || true
                     [ $NOITE -eq 1 ] && POST_ID="sex15-story-novidade"       || true ;;
            *) echo "⏭️  Sem post para $DIA."; echo "id=" >> $GITHUB_OUTPUT; exit 0 ;;
          esac
          if [ -z "$POST_ID" ]; then
            echo "⏭️  $DIA às ${HORA}h UTC — fora das janelas. Ignorado."
            echo "id=" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "✅ Post: $POST_ID ($DIA ${HORA}h UTC)"
          echo "id=${POST_ID}" >> $GITHUB_OUTPUT

      - name: Verificar cache (anti-dupla)
        id: cache
        if: steps.post.outputs.id != ''
        uses: actions/cache@v4
        with:
          path: .cache-posted
          key: posted-${{ steps.post.outputs.id }}

      - name: Setup Node.js
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Instalar Playwright
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Publicar no Instagram
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}

      - name: Marcar como publicado
        if: steps.post.outputs.id != '' && steps.cache.outputs.cache-hit != 'true'
        run: mkdir -p .cache-posted && echo "ok" > .cache-posted/${{ steps.post.outputs.id }}
