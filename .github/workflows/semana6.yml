name: SmartGuest — Semana 6

on:
  schedule:
    # seg 18/06 às 10h BRT = 13h UTC
    - cron: '0 13 18 6 *'
    # seg 18/06 às 19h BRT = 22h UTC
    - cron: '0 22 18 6 *'
    # ter 19/06 às 10h BRT = 13h UTC
    - cron: '0 13 19 6 *'
    # ter 19/06 às 19h BRT = 22h UTC
    - cron: '0 22 19 6 *'
    # qua 20/06 às 10h BRT = 13h UTC
    - cron: '0 13 20 6 *'
    # qua 20/06 às 19h BRT = 22h UTC
    - cron: '0 22 20 6 *'
    # qui 21/06 às 10h BRT = 13h UTC
    - cron: '0 13 21 6 *'
    # qui 21/06 às 19h BRT = 22h UTC
    - cron: '0 22 21 6 *'
    # sex 22/06 às 10h BRT = 13h UTC
    - cron: '0 13 22 6 *'
    # sex 22/06 às 19h BRT = 22h UTC
    - cron: '0 22 22 6 *'

  workflow_dispatch:
    inputs:
      post_id:
        description: 'ID do post para publicar manualmente'
        required: true
        type: string

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Determinar post do dia
        id: post
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "id=${{ inputs.post_id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIA=$(date -u +"%m-%d")
          HORA=$(date -u +"%H")
          case "${DIA}-${HORA}" in
            "06-18-13") echo "id=seg18-carousel-link" >> $GITHUB_OUTPUT ;;
            "06-18-22") echo "id=seg18-story-avaliacao" >> $GITHUB_OUTPUT ;;
            "06-19-13") echo "id=ter19-carousel-recepcionista" >> $GITHUB_OUTPUT ;;
            "06-19-22") echo "id=ter19-story-motor" >> $GITHUB_OUTPUT ;;
            "06-20-13") echo "id=qua20-carousel-hospede" >> $GITHUB_OUTPUT ;;
            "06-20-22") echo "id=qua20-story-bastidores" >> $GITHUB_OUTPUT ;;
            "06-21-13") echo "id=qui21-carousel-metricas" >> $GITHUB_OUTPUT ;;
            "06-21-22") echo "id=qui21-story-dificuldade" >> $GITHUB_OUTPUT ;;
            "06-22-13") echo "id=sex22-carousel-pequenas" >> $GITHUB_OUTPUT ;;
            "06-22-22") echo "id=sex22-story-cta" >> $GITHUB_OUTPUT ;;
            *)
              echo "Nenhum post agendado para $DIA às $HORA UTC"
              exit 1
              ;;
          esac

      - name: Publicar no Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: node postar.js ${{ steps.post.outputs.id }}
